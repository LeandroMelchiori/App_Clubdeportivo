# PostgreSQL para desarrollo local. Las credenciales son solo para esta base local.
name: club-deportivo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: clubdeportivo
      POSTGRES_USER: clubdeportivo
      POSTGRES_PASSWORD: clubdeportivo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubdeportivo -d clubdeportivo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
