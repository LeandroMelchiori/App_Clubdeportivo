spring:
  application:
    name: club-deportivo-api
  # Apunta al PostgreSQL de docker-compose.yml. En otros entornos se reemplaza con las variables
  # SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/clubdeportivo
    username: clubdeportivo
    password: clubdeportivo
  jackson:
    deserialization:
      # Un campo de más se rechaza: por ejemplo, un clubId en el cuerpo, que nunca se acepta como parámetro.
      fail-on-unknown-properties: true

club:
  auth:
    # Clave de firma de los tokens de acceso, en Base64 y de 32 bytes o más. Sale del entorno, nunca
    # del repositorio: sin ella la API no arranca.
    jwt-secret: ${CLUB_AUTH_JWT_SECRET:}
  network:
    # Proxies de confianza, en CIDR y separados por coma: solo a ellos se les cree X-Forwarded-For para
    # saber la IP del cliente. Vacío, se usa la IP de la conexión. En la VM es la red `proxy` de Traefik.
    trusted-proxies: ${CLUB_TRUSTED_PROXIES:}

management:
  endpoints:
    web:
      # La salud queda en /api/v1/health, junto con el resto de la API.
      base-path: /api/v1
      discovery:
        enabled: false
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
  show-actuator: true
