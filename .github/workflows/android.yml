name: Android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tests JVM, Lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests JVM
        run: ./gradlew testDemoDebugUnitTest testProductionDebugUnitTest

      - name: Lint
        run: ./gradlew lintDemoDebug lintProductionDebug

      - name: Build
        run: ./gradlew assembleDemoDebug assembleProductionDebug

      - name: Reportes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            **/build/reports
            **/build/test-results
          retention-days: 7
