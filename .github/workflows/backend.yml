name: Backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tests y build del backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests con PostgreSQL en Testcontainers
        run: ./gradlew :backend:test

      - name: Build
        run: ./gradlew :backend:bootJar

      - name: Reportes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: |
            backend/build/reports
            backend/build/test-results
          retention-days: 7
